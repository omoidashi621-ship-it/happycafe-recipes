<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>世界樹の図書館</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">

  <section id="screen-title" class="screen active">
    <h1>世界樹の図書館</h1>
    <p class="sub">― 星々の記憶が眠る、異世界の書庫へ ―</p>
    <label class="field">旅人の名前
      <input id="name-input" maxlength="12" placeholder="名前を入力" autocomplete="off">
    </label>
    <button id="btn-to-avatar" class="primary">はじめる</button>
    <p id="mode-note" class="note"></p>
  </section>

  <section id="screen-avatar" class="screen">
    <h2>アバターを選ぶ</h2>
    <div class="preview-row"><canvas id="avatar-preview" width="200" height="220"></canvas></div>
    <div id="avatar-options"></div>
    <div class="nav">
      <button id="btn-avatar-back">戻る</button>
      <button id="btn-to-job" class="primary">次へ</button>
    </div>
  </section>

  <section id="screen-job" class="screen">
    <h2>ジョブを選ぶ</h2>
    <div id="job-list"></div>
    <div class="nav">
      <button id="btn-job-back">戻る</button>
      <button id="btn-enter" class="primary">図書館に入る</button>
    </div>
  </section>

  <section id="screen-world" class="screen">
    <canvas id="world"></canvas>
    <div id="hud-top"><span id="hud-room"></span><span id="hud-count"></span></div>
    <div id="hint"></div>
    <div id="chat">
      <div id="chat-log"></div>
      <form id="chat-form">
        <input id="chat-input" maxlength="60" placeholder="Enter でチャット / 矢印・WASD かタップで移動" autocomplete="off">
        <button type="button" id="btn-emote" title="エモート">✨</button>
        <button>送信</button>
      </form>
    </div>
  </section>

</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
