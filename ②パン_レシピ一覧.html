<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パン　レシピ一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: #F8F5F0;
  color: #2C2416;
  padding: 1.5rem 1rem 4rem;
  max-width: 640px;
  margin: 0 auto;
  font-size: 14px;
  line-height: 1.6;
}
h1 {
  font-family: 'Noto Serif JP', serif;
  font-size: 16px;
  font-weight: 500;
  color: #6B5040;
  letter-spacing: .12em;
  margin-bottom: 1.5rem;
  padding-bottom: .75rem;
  border-bottom: 1px solid #E2D9CF;
}
.item { border-bottom: 1px solid #E2D9CF; }
.item:first-of-type { border-top: 1px solid #E2D9CF; }
.toggle {
  width: 100%; display: flex; align-items: center;
  justify-content: space-between; padding: 14px 0;
  background: none; border: none; cursor: pointer;
  text-align: left; gap: 10px;
}
.toggle:hover .recipe-name { color: #9C7B5A; }
.recipe-name {
  flex: 1;
  font-family: 'Noto Serif JP', serif;
  font-size: 14px; font-weight: 500;
  color: #2C2416; letter-spacing: .02em;
}
.right-side { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.servings { font-size: 11px; color: #A08060; font-weight: 400; white-space: nowrap; }
.arrow { font-size: 10px; color: #C0A882; transition: transform .2s ease; flex-shrink: 0; }
.toggle.open .arrow { transform: rotate(180deg); }
.body { display: none; padding: 0 0 18px; }
.body.open { display: block; }

/* 倍率ボタン */
.mult-row {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 14px; padding: 10px 12px;
  background: #F2EDE6; border-radius: 8px;
}
.mult-label { font-size: 11px; color: #A08060; margin-right: 2px; white-space: nowrap; }
.mult-btn {
  padding: 4px 14px; font-size: 12px; font-family: inherit;
  border: 1px solid #D4C4B0; border-radius: 20px;
  background: #fff; color: #6B5040; cursor: pointer;
  transition: all .15s; white-space: nowrap;
}
.mult-btn:hover { background: #EDE5D8; }
.mult-btn.active { background: #6B5040; border-color: #6B5040; color: #fff; }

/* セクション */
.section { margin-bottom: 14px; }
.section:last-of-type { margin-bottom: 0; }
.sec-title {
  font-size: 11px; font-weight: 500; color: #6B5040;
  letter-spacing: .08em; padding: 5px 10px;
  background: #EDE5D8; border-left: 3px solid #C4A882;
  border-radius: 0 4px 4px 0; margin-bottom: 6px;
}
.ing-row {
  display: flex; justify-content: space-between;
  align-items: baseline; padding: 5px 4px;
  border-bottom: 1px solid #F0EAE3;
  font-size: 13px; gap: 12px;
}
.ing-row:last-child { border-bottom: none; }
.ing-name { color: #3A2E24; }
.ing-amount { color: #8B7355; white-space: nowrap; flex-shrink: 0; }

/* メモ */
.memo-wrap { margin-top: 16px; padding-top: 14px; border-top: 1px dashed #E2D9CF; }
.memo-label { font-size: 11px; color: #B0906A; margin-bottom: 5px; letter-spacing: .05em; }
textarea {
  width: 100%; padding: 8px 10px; font-size: 13px; font-family: inherit;
  border: 1px solid #D4C4B0; border-radius: 6px;
  background: #FBF8F5; color: #3A2E24;
  resize: vertical; min-height: 68px; line-height: 1.65;
}
textarea:focus { outline: none; border-color: #9C7B5A; background: #fff; }
textarea::placeholder { color: #CDBFAF; }
.save-row { display: flex; align-items: center; margin-top: 6px; }
.save-btn {
  padding: 4px 13px; font-size: 12px;
  border: 1px solid #D4C4B0; border-radius: 5px;
  background: none; color: #8B7355; cursor: pointer; font-family: inherit;
}
.save-btn:hover { background: #EDE5D8; }
.saved-msg { font-size: 11px; color: #A08060; margin-left: 8px; opacity: 0; transition: opacity .3s; }
.saved-msg.show { opacity: 1; }
</style>
</head>
<body>
<h1>パン　レシピ一覧</h1>
<div id="list"></div>
<script>
const CATEGORY = 'pan';
const recipes = [{"name": "角食パン", "servings": "2本分", "sections": [{"title": "", "items": [{"name": "強力粉（スーパーカメリア）", "amount": "1000g"}, {"name": "塩", "amount": "20g"}, {"name": "上白糖", "amount": "80g"}, {"name": "生イースト", "amount": "40g"}, {"name": "スキムミルク", "amount": "20g"}, {"name": "コンデンスミルク", "amount": "20g"}, {"name": "マーガリン", "amount": "50g"}, {"name": "バター", "amount": "50g"}, {"name": "水", "amount": "680g"}]}]}, {"name": "バゲット（全粒粉入り）", "servings": "5.5本分", "sections": [{"title": "", "items": [{"name": "準強力粉（リスドオル）", "amount": "900g"}, {"name": "全粒粉", "amount": "100g"}, {"name": "塩", "amount": "20g"}, {"name": "インスタントドライイースト（赤）", "amount": "7g"}, {"name": "モルトシロップ", "amount": "10g"}, {"name": "イビスアジュール", "amount": "10g"}, {"name": "水", "amount": "650g"}]}]}, {"name": "クアトロフォルマッジョ", "servings": "約16個分", "sections": [{"title": "生地", "items": [{"name": "強力粉（スーパーカメリア）", "amount": "350g"}, {"name": "準強力粉（リスドオル）", "amount": "150g"}, {"name": "塩", "amount": "10g"}, {"name": "上白糖", "amount": "18g"}, {"name": "インスタントドライイースト（赤）", "amount": "7g"}, {"name": "オリーブオイル", "amount": "20g"}, {"name": "マッシュポテト", "amount": "125g"}, {"name": "イビスアジュール", "amount": "5g"}, {"name": "水", "amount": "225g"}]}, {"title": "フィリング", "items": [{"name": "フロマージュブラン", "amount": "240g"}, {"name": "モッツァレラチーズ", "amount": "192g"}, {"name": "クリームチーズ", "amount": "192g"}, {"name": "シュレッドチーズ", "amount": "240g"}, {"name": "エダムチーズ", "amount": "72g"}, {"name": "ハチミツ", "amount": "72g"}, {"name": "ブラックペッパー", "amount": "適量"}]}]}, {"name": "クリームパン", "servings": "約24個分", "sections": [{"title": "生地", "items": [{"name": "強力粉（スーパーカメリア）", "amount": "500g"}, {"name": "塩", "amount": "8g"}, {"name": "上白糖", "amount": "60g"}, {"name": "トレハロース", "amount": "30g"}, {"name": "インスタントドライイースト（金）", "amount": "10g"}, {"name": "コンデンスミルク", "amount": "25g"}, {"name": "ハチミツ", "amount": "50g"}, {"name": "加糖卵黄", "amount": "125g"}, {"name": "バター", "amount": "67g"}, {"name": "イビスアジュール", "amount": "5g"}, {"name": "水", "amount": "190g"}]}, {"title": "カスタードクリーム", "items": [{"name": "牛乳", "amount": "1000g"}, {"name": "バニラ", "amount": "少々"}, {"name": "加糖卵黄", "amount": "300g"}, {"name": "グラニュー糖", "amount": "190g"}, {"name": "薄力粉（バイオレット）", "amount": "100g"}, {"name": "バター", "amount": "100g"}, {"name": "バニラペースト", "amount": "1g"}]}]}, {"name": "塩パン", "servings": "約30個分", "sections": [{"title": "生地", "items": [{"name": "強力粉", "amount": "2000g"}, {"name": "塩", "amount": "40g"}, {"name": "上白糖", "amount": "80g"}, {"name": "インスタントドライイースト", "amount": "20g"}, {"name": "バター", "amount": "180g"}, {"name": "イビスアジュール", "amount": "20g"}, {"name": "水", "amount": "1300g"}]}, {"title": "仕上げ", "items": [{"name": "有塩バター（1個10g）", "amount": "10g／個"}]}]}, {"name": "ガーリックラスク", "servings": "個数未定", "sections": [{"title": "", "items": [{"name": "乾燥バゲット", "amount": "80g"}, {"name": "ガーリックスプレッド", "amount": "30g"}, {"name": "オリーブオイル", "amount": "10g"}, {"name": "エダムチーズ", "amount": "10g"}, {"name": "鷹の爪", "amount": "1本"}]}]}, {"name": "ハニートースト", "servings": "10個分", "sections": [{"title": "", "items": [{"name": "角食パン（4枚切りハーフカット）", "amount": "10個"}, {"name": "バター", "amount": "100g"}, {"name": "ハチミツ", "amount": "100g"}, {"name": "メープルシロップ", "amount": "20g"}, {"name": "グラニュー糖", "amount": "300g"}, {"name": "塩", "amount": "2g"}]}]}];

function formatAmount(base, mult) {
  if (!base) return '';
  if (['適量','QS','少々','未定','後日入力'].includes(base.trim())) return base;
  const m = base.match(/^(約?)([\d]+(?:\.[\d]+)?)(.*?)$/);
  if (!m) return base;
  const num = parseFloat(m[2]) * mult;
  const r = Math.round(num * 10) / 10;
  const s = (r % 1 === 0) ? r.toFixed(0) : r.toFixed(1);
  return m[1] + s + m[3];
}

function setMult(btn, idx, mult) {
  btn.closest('.mult-row').querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('#body-' + idx + ' .ing-amount').forEach(el => {
    el.textContent = formatAmount(el.dataset.base, mult);
  });
}

function buildList() {
  const container = document.getElementById('list');
  recipes.forEach((r, i) => {
    const div = document.createElement('div');
    div.className = 'item';
    let secHTML = r.sections.map(s => {
      const th = s.title ? '<div class="sec-title">' + s.title + '</div>' : '';
      const rows = s.items.map(it => {
        const a = it.amount || '';
        return '<div class="ing-row"><span class="ing-name">' + it.name +
          '</span><span class="ing-amount" data-base="' + a + '">' + a + '</span></div>';
      }).join('');
      return '<div class="section">' + th + rows + '</div>';
    }).join('');
    const memo = localStorage.getItem(CATEGORY + '_memo_' + i) || '';
    div.innerHTML =
      '<button class="toggle" onclick="toggleItem(this)" aria-expanded="false">' +
        '<span class="recipe-name">' + r.name + '</span>' +
        '<span class="right-side"><span class="servings">' + r.servings + '</span>' +
        '<span class="arrow">▼</span></span>' +
      '</button>' +
      '<div class="body" id="body-' + i + '">' +
        '<div class="mult-row">' +
          '<span class="mult-label">分量</span>' +
          '<button class="mult-btn active" onclick="setMult(this,' + i + ',1)">× 1</button>' +
          '<button class="mult-btn" onclick="setMult(this,' + i + ',1.5)">× 1.5</button>' +
          '<button class="mult-btn" onclick="setMult(this,' + i + ',2)">× 2</button>' +
        '</div>' +
        secHTML +
        '<div class="memo-wrap">' +
          '<p class="memo-label">メモ</p>' +
          '<textarea id="memo-' + i + '" placeholder="アレンジや気づきなど…">' + memo + '</textarea>' +
          '<div class="save-row">' +
            '<button class="save-btn" onclick="saveMemo(' + i + ')">保存</button>' +
            '<span class="saved-msg" id="saved-' + i + '">保存しました</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    container.appendChild(div);
  });
}

function toggleItem(btn) {
  const isOpen = btn.classList.contains('open');
  btn.classList.toggle('open', !isOpen);
  btn.nextElementSibling.classList.toggle('open', !isOpen);
  btn.setAttribute('aria-expanded', String(!isOpen));
}

function saveMemo(idx) {
  localStorage.setItem(CATEGORY + '_memo_' + idx, document.getElementById('memo-' + idx).value);
  const msg = document.getElementById('saved-' + idx);
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 2000);
}

buildList();
</script>
</body>
</html>
